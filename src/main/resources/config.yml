# Double Life Configuration
# Time values can use 'm' for minutes or 'h' for hours

# Language Settings
language:
  default: "en"

# Maximum duration for a Double Life session
max-duration: 10m

# Cooldown between sessions
cooldown: 5m

# Most minutes a session can be extended by in total (/dl extend)
max-extension: 10m

# Ask staff why they start a session (dialog). Empty answers are refused when true.
require-reason: true

# Permissions granted during Default mode (e.g. a land-claim bypass for heralds)
# Use '-permission' to explicitly deny a permission
default-permissions: []

# Permissions granted during Turbo mode
# Use '-permission' to explicitly deny a permission
temporary-permissions:
  - "*"
  - "-doublelife.use"
  - "-doublelife.admin"

# Commands executed when entering Double Life mode (Turbo mode only)
# Use {player} as a placeholder for the player's name
entry-commands:
  - "gamemode creative {player}"

# Commands executed when leaving Double Life mode (also on quit, kick and timeout)
# Prefix with "player:" to run the command as the player instead of the console
exit-commands:
  - "player:co inspect off"

# Group Command Restrictions (for Default mode)
# Commands listed here require DoubleLife mode to execute
# An entry can be a whole command ("co") or a subcommand ("coi turbo")
# Format: groupname: [list of commands]
group-commands:
  moderator:
    - "tp"
    - "tpa"
    - "tphere"
    - "co"
    - "coreprotect"
    - "gm"
    - "gamemode"
  administrator:
    - "tp"
    - "tpa" 
    - "tphere"
    - "co"
    - "coreprotect"
    - "gm"
    - "gamemode"
    - "give"
    - "item"
    - "enchant"
    - "effect"
    - "weather"
    - "time"
  helper:
    - "tp"
    - "tpa"
    - "tphere"

# Commands that are never restricted, even if a group-commands entry matches them
# Example: ["coi church pray"] when "coi" is restricted but praying should work outside DL
always-allowed-commands: []

# GUI Settings
gui:
  enabled: true

# Activity Logging Settings
logging:
  commands: true
  gamemode-changes: true
  item-give: true
  container-access: true
  block-placements: true
  item-drops: true

# Webhook Settings
webhook:
  discord:
    enabled: false
    url: ""
    format: "markdown" # Options: markdown, json
    turbo-mention: true # Whether flagged reports may use @here at all
  callback:
    enabled: false
    url: ""
    method: "POST"
    headers:
      Authorization: "Bearer YOUR_TOKEN_HERE"

# AI Integration (Gemini)
ai:
  enabled: false
  api-key: ""              # Google AI Studio API key — keep this secret!
  model: "gemini-3.1-flash-lite"

# Risk Scoring
risk:
  # Each flag counts once per session, however often the action repeats
  # Minimum level for a flagged report with AI verdict: LOW, MEDIUM, HIGH
  threshold: "MEDIUM"
  # Minimum level for an @here ping (an AI verdict of ABUSE also pings)
  ping-threshold: "HIGH"
  levels:
    medium: 6
    high: 15
  weights:
    creative-container: 5   # moved items in containers while in creative
    teleport-then-drop: 8   # teleport followed by item drop
    item-drop-volume: 3     # dropped items at least drop-volume times
    container-access: 2     # opened at least container-access containers
    block-break-velocity: 3 # high-velocity breaking burst
    sensitive-command: 2    # per distinct sensitive-command pattern used
    self-targeted: 8        # a sensitive command aimed at themselves (@s, @p or own name)
  velocity:
    block-window-seconds: 5   # rolling window for velocity check
    block-count: 30           # breaks within that window to trigger
  teleport-drop-window-seconds: 15  # seconds after teleport to watch for drops
  thresholds:
    drop-volume: 5          # item drop count before flagging
    container-access: 5     # container opens before flagging
  # Patterns matched against the full command string (case-insensitive regex).
  # A plain string like "/give" matches any command containing "/give".
  # Use standard Java regex — e.g. "/co (restore|rollback)" for OR patterns.
  sensitive-commands:
    - "/give"
    - "/effect"
    - "gamemode creative"
    - "gm c"
    - "/co restore"
    - "/co rollback"

# Notification behaviour
notifications:
  # Whether to post a quiet (no-ping) Discord summary for clean sessions
  clean-summary: true
  # Each staff member pings at most once per this window, so back-to-back sessions don't flood
  ping-cooldown: 30m

# In-game session history (/dl history)
history:
  retention-days: 90

# Operator whitelist — only players listed here are allowed to hold operator status.
# Any other online player found with op will be immediately de-opped with a warning.
# Checked on join, quit, and every 20 ticks while online.
op-whitelist:
  enabled: false
  allowed-ops: []
  # Example:
  # allowed-ops:
  #   - "Notch"
  #   - "Herobrine"